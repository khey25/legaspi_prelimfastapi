<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hustle Hub</title>
    <link rel="stylesheet" href="menu.css">
</head>
<body>
    <!-- Modern Neon Pulsating Background -->
    <div class="neon-bg">
        <div class="pulsating-circle"></div>
    </div>
    
    <!-- Header Section -->
    <header>
        <h1>THE HUSTLE HUB</h1>
        <div class="controls">
            <input type="text" id="search-bar" placeholder="Search for Games (e.g. GTA, Farming...)">
            <button id="tools-btn">Tools</button>
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="main-content">
        <h2>SELECT YOUR GRIND</h2>
        
        <!-- EMPTY CONTAINER: JavaScript will inject the API data here -->
        <div class="category-options" id="games-grid"></div>
    </main>

    <!-- Tools Modal Overlay -->
    <div id="tools-overlay" class="hidden">
        <div class="modal-content">
            <button id="close-tools-btn" class="close-btn">X</button>
            <h2>SELECT A TOOL</h2>
            
            <div class="category-options">
                <!-- Tool 1: The Hustle Match -->
                <div class="category-card" id="tool-matchmaker">
                    <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/matchmaker.jpg?raw=true" alt="Matchmaker" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.5; position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;">
                    <p style="position: relative; z-index: 1; margin: 0; color: #fff; text-shadow: 2px 2px 6px #000; pointer-events: none;">The Hustle Match</p>
                </div>
                
                <!-- Tool 2: Coming Soon -->
                <div class="category-card">
                    <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/comingsoon.jpg?raw=true" alt="Coming Soon" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.5; position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;">
                    <p style="position: relative; z-index: 1; margin: 0; color: #fff; text-shadow: 2px 2px 6px #000; pointer-events: none;">Coming soon...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="menu.js"></script>
</body>
</html>
