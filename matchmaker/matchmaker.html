<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hustle Matchmaker</title>
    <link rel="stylesheet" href="matchmaker.css">
</head>
<body>
    <!-- Subtle Golden Pulsating Background -->
    <div class="neon-bg">
        <div class="pulsating-circle-gold"></div>
    </div>
    
    <header>
        <h1>THE HUSTLE MATCH</h1>
        <button id="home-btn" class="nav-btn">Return to Hub</button>
    </header>

    <!-- Quiz Container -->
    <main class="quiz-container" id="quiz-box">
        <h2 id="question-text">Ready to find your perfect grind?</h2>
        <div class="options-container" id="options-box">
            <button class="quiz-btn" id="start-btn">Start Matchmaker</button>
        </div>
        
        <!-- NEW: Infinite Auto-Scrolling Carousel -->
        <div class="carousel-container" id="game-carousel">
            <div class="carousel-track">
                <!-- Original Image Set -->
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/gtaonline.jpg?raw=true" class="carousel-img" alt="GTA Online">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/stardew.jpg?raw=true" class="carousel-img" alt="Stardew Valley">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/warframe.jpg?raw=true" class="carousel-img" alt="Warframe">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/minecraft.jpg?raw=true" class="carousel-img" alt="Minecraft">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/cyberpunk.jpg?raw=true" class="carousel-img" alt="Cyberpunk 2077">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/runescape.jpg?raw=true" class="carousel-img" alt="OSRS">
                
                <!-- Duplicated Set for Seamless Infinite Looping -->
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/gtaonline.jpg?raw=true" class="carousel-img" alt="GTA Online">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/stardew.jpg?raw=true" class="carousel-img" alt="Stardew Valley">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/warframe.jpg?raw=true" class="carousel-img" alt="Warframe">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/minecraft.jpg?raw=true" class="carousel-img" alt="Minecraft">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/cyberpunk.jpg?raw=true" class="carousel-img" alt="Cyberpunk 2077">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/menuimages/runescape.jpg?raw=true" class="carousel-img" alt="OSRS">
            </div>
        </div>

        <!-- Go Back Button (Hidden by default) -->
        <button id="back-btn" class="quiz-btn hidden" style="margin-top: 30px; border-color: #555; color: #aaa; font-size: 1rem; padding: 10px 20px;">
            &#8592; Go Back
        </button>
    </main>

    <!-- Results Container (Hidden until quiz is done) -->
    <main class="results-container hidden" id="results-box">
        <h2>Your Top Recommended Grinds</h2>
        <div class="match-grid" id="recommendation-grid">
            <!-- JavaScript will inject cards here -->
        </div>
        <button class="quiz-btn restart-btn" id="restart-btn">Take Quiz Again</button>
    </main>

    <!-- Split-Screen Detail Modal -->
    <div id="details-overlay" class="hidden">
        <div class="details-modal-content">
            <button id="close-details-btn" class="close-btn">X</button>
            <div class="details-split">
                <div class="details-image"></div>
                <div class="details-text">
                    <h3 id="detail-title">Item Name</h3>
                    <p></p>
                </div>
            </div>
        </div>
    </div>

    <script src="matchmaker.js"></script>
</body>
</html>
