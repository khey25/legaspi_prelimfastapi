
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stardew Valley Farming</title>
    <link rel="stylesheet" href="stardewmenu.css">
</head>
<body>
    <!-- 
      VIDEO BACKGROUND:
      Paste your direct .mp4 link inside the src="" attribute below!
    -->
    <video id="bg-video" autoplay loop muted playsinline src="https://github.com/khey25/legaspi_prelimfastapi/raw/refs/heads/main/stardew/stardewvideo/stardewmenu.mp4"></video>

    <!-- Header Section -->
    <header>
        <h1>WELCOME TO PELICAN TOWN</h1>
        
        <div class="controls">
            <input type="text" id="search-bar" placeholder="Search the valley...">
            <button id="categories-btn">Categories</button>
            <button id="home-btn">Home</button>
        </div>
    </header>

    <!-- Main Content Section -->
    <main class="main-content">
        <h2>HIGHLY DEMANDED PRODUCTS</h2>
        
        <div class="category-options">
            
            <!-- Card 1: Crops -->
            <div class="nav-card" id="card-crops">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/starfruit.jpg?raw=true" class="nav-img" alt="Crops">
            </div>
            
            <!-- Card 2: Artisan Goods -->
            <div class="nav-card" id="card-artisan">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/starfruitwine.jpg?raw=true" class="nav-img" alt="Artisan Goods">
                
            </div>
            
            <!-- Card 3: Animal Products -->
            <div class="nav-card" id="card-animals">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/truffle.jpg?raw=true" class="nav-img" alt="Animal Products">
                
            </div>

        </div>
    </main>

    <!-- Modal 1: Categories Overlay -->
    <div id="categories-overlay" class="hidden">
        <div class="modal-content">
            <button id="close-modal-btn" class="close-btn">X</button>
            <h2>SELECT A PATH</h2>
            
            <div class="category-options">
                
                <!-- Category: Crops -->
                <div class="category-card" id="cat-crops">
                    <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/starfruit.jpg?raw=true" alt="Crops" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.5; position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;">
                    <p style="position: relative; z-index: 1; margin: 0; color: #fff; text-shadow: 2px 2px 6px #000; pointer-events: none;">Crops</p>
                </div>
                
                <!-- Category: Artisan Goods -->
                <div class="category-card" id="cat-artisan">
                    <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/starfruitwine.jpg?raw=true" alt="Artisan" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.5; position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;">
                    <p style="position: relative; z-index: 1; margin: 0; color: #fff; text-shadow: 2px 2px 6px #000; pointer-events: none;">Artisan Goods</p>
                </div>
                
                <!-- Category: Animal Products -->
                <div class="category-card" id="cat-animals">
                    <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/truffle.jpg?raw=true" alt="Animals" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.5; position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;">
                    <p style="position: relative; z-index: 1; margin: 0; color: #fff; text-shadow: 2px 2px 6px #000; pointer-events: none;">Animal Products</p>
                </div>

            </div>
        </div>
    </div>

    <!-- Modal 2: Split-Screen Details -->
    <div id="details-overlay" class="hidden">
        <div class="details-modal-content">
            <button id="close-details-btn" class="close-btn">X</button>
            <div class="details-split">
                <div class="details-image"></div>
                <div class="details-text">
                    <h3 id="detail-title"></h3>
                    <p></p>
                </div>
            </div>
        </div>
    </div>

    <script src="stardewmenu.js"></script>
</body>
</html>
