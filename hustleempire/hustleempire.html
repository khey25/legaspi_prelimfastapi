<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Hustle Empire</title>
    <link rel="stylesheet" href="hustleempire.css">
</head>
<body>
    <div class="neon-bg">
        <div class="pulsating-circle-green"></div>
    </div>
    
    <header>
        <h1>THE HUSTLE EMPIRE</h1>
        <button id="home-btn" class="nav-btn">Return to Hub</button>
    </header>

    <main class="quiz-container" id="calculator-box">
        <h2 id="step-title">FROM THE BOTTOM TO THE TOP</h2>      
        <!-- MATCHMAKER EXACT: The hardcoded start button inside the options box -->
        <div class="options-container" id="dynamic-options">
            <button class="quiz-btn" id="start-btn">Build Your Empire</button>
        </div>

        <!-- MATCHMAKER EXACT: Infinite Auto-Scrolling Carousel -->
        <div class="carousel-container" id="empire-carousel">
            <div class="carousel-track">
                <!-- Original Image Set -->
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/gta/gtaimages/cayo.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/goldclock.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/gta/gtaimages/nightclub.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/obelisk.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/gta/gtaimages/casino.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/starfruitwine.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/gta/gtaimages/doomsday.jpg?raw=true" class="carousel-img">
                
                <!-- Duplicated Set for Seamless Infinite Looping -->
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/gta/gtaimages/cayo.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/goldclock.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/gta/gtaimages/nightclub.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/obelisk.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/gta/gtaimages/casino.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/stardew/stardewimages/starfruitwine.jpg?raw=true" class="carousel-img">
                <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/gta/gtaimages/doomsday.jpg?raw=true" class="carousel-img">
            </div>
        </div>

        <button id="back-btn" class="quiz-btn hidden" style="margin-top: 30px; border-color: #555; color: #aaa; font-size: 1rem; padding: 10px 20px;">
            &#8592; Go Back
        </button>
    </main>

    <main class="results-container hidden" id="results-box">
        <h2 id="results-header">Your Custom Grind Plan</h2>
        <h3 id="shortfall-display" style="color: #4CAF50; margin-bottom: 30px;"></h3>
        <div class="match-grid" id="recommendation-grid">
        </div>
        <button class="quiz-btn restart-btn" id="restart-btn">Calculate Another Goal</button>
    </main>

    <!-- Details Modal -->
    <div id="details-overlay" class="hidden">
        <div class="details-modal-content">
            <button id="close-details-btn" class="close-btn">X</button>
            <div class="details-split">
                <div class="details-image"></div>
                <div class="details-text">
                    <h3 id="detail-title">Item Name</h3>
                    <p></p>
                </div>
            </div>
        </div>
    </div>

    <script src="hustleempire.js"></script>
</body>
</html>
