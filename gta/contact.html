<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA Contact Missions</title>
    <link rel="stylesheet" href="contact.css">
</head>
<body>
<body>
    <!-- Background Slider -->
    <div id="bg-slider"></div>

    <!-- Header Section (Leave the rest of your code exactly as is!) -->
    <header>
        <h1>Pick up the phone, it's money calling...</h1>
        <div class="controls">
            <input type="text" id="search-bar" placeholder="Search missions...">
            <button id="categories-btn">Categories</button>
        </div>
    </header>

    <main class="main-content">
        <!-- Rank 1 -->
        <section class="rank-section">
            <h2 class="rank-green">Money and Time Efficient</h2>
            <div class="contact-grid" id="grid-efficient"></div>
        </section>

        <!-- Rank 2 -->
        <section class="rank-section">
            <h2 class="rank-yellow">Just for the Vibes</h2>
            <div class="contact-grid" id="grid-vibes"></div>
        </section>

        <!-- Rank 3 -->
        <section class="rank-section">
            <h2 class="rank-red">Why are you even doing this?</h2>
            <div class="contact-grid" id="grid-why"></div>
        </section>
    </main>

    <!-- Modal 1: Categories Navigation -->
    <div id="categories-overlay" class="hidden">
        <div class="modal-content">
            <button id="close-categories-btn" class="close-btn">X</button>
            <h2>Select a Path</h2>
            <div class="category-options">
                
                <!-- Category: Home -->
                <div class="category-card" id="nav-home">
                    <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/gta/gtaimages/home.jpg?raw=true" alt="Home" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.5; position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;">
                    <p style="position: relative; z-index: 1; margin: 0; color: #fff; text-shadow: 2px 2px 6px #000; pointer-events: none;">Home</p>
                </div>
                
                <!-- Category: Business -->
                <div class="category-card" id="nav-business">
                    <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/gta/gtaimages/nightclub.jpg?raw=true" alt="Business" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.5; position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;">
                    <p style="position: relative; z-index: 1; margin: 0; color: #fff; text-shadow: 2px 2px 6px #000; pointer-events: none;">Business</p>
                </div>
                
                <!-- Category: Heists -->
                <div class="category-card" id="nav-heists">
                    <img src="https://github.com/khey25/legaspi_prelimfastapi/blob/main/gta/gtaimages/cayo.jpg?raw=true" alt="Heists" style="width: 100%; height: 100%; object-fit: cover; opacity: 0.5; position: absolute; top: 0; left: 0; z-index: 0; pointer-events: none;">
                    <p style="position: relative; z-index: 1; margin: 0; color: #fff; text-shadow: 2px 2px 6px #000; pointer-events: none;">Heists</p>
                </div>
                
            </div>
        </div>
    </div>


    <!-- Details Modal -->
    <div id="details-overlay" class="hidden">
        <div class="details-modal-content">
            <button id="close-details-btn" class="close-btn">X</button>
            <div class="details-split">
                <div class="details-image"></div>
                <div class="details-text">
                    <h3 id="detail-title">Mission Name</h3>
                    <p>Details coming soon...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="contact.js"></script>
</body>
</html>
